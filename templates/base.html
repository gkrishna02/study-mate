<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}StudyMate{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Animated Aurora Background -->
  <div class="aurora">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <!-- Usability Test Taskbar -->
  <div id="taskbar" hidden></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </span>
        <span class="brand-name">Study<span>Mate</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Browse</a>
        <a href="/upload" class="nav-link">Upload</a>
        <a href="/test" class="nav-link cta">Participate in Test</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2025 StudyMate · A Design Thinking Project</p>
      <p class="muted">Built with Flask · Python · Statistics</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
